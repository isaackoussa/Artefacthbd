# Configuration Netlify — site statique, aucun build nécessaire
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Pas de mise en cache longue : chaque visite vérifie si un fichier a changé
# (Netlify répond « inchangé » très vite grâce aux ETag).
